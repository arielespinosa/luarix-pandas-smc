[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pandas-luarix"
version = "0.1.0"
description = "pandas DataFrame accessors (.smc, .indicators, .analysis) for Smart Money Concepts and indicator analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.4",
    "pandas_ta_classic>=0.5.44",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyterlab>=4.0",
    "matplotlib>=3.9",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings-python>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pandas_luarix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
